<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de pedido — Fungiterra</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;font-family:'Inter',sans-serif}
.ft-page{max-width:480px;margin:0 auto;padding:20px 16px 40px}
.ft-wrap{font-family:'Inter',sans-serif;background:#f4f6f8;padding:16px;border-radius:16px}
.ft-header{background:#2B7FC0;border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.ft-logo-circle{width:40px;height:40px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#2B7FC0;flex-shrink:0}
.ft-header-text h2{margin:0;font-size:15px;font-weight:600;color:white}
.ft-header-text p{margin:0;font-size:12px;color:rgba(255,255,255,0.75)}
.ft-card{background:white;border-radius:12px;padding:16px 20px;margin-bottom:12px;border:0.5px solid #e5e7eb}
.ft-evidencia-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ft-evidencia-thumb{width:52px;height:52px;object-fit:cover;border-radius:9px;border:0.5px solid #e5e7eb;display:block}
.ft-evidencia-archivo{display:flex;align-items:center;justify-content:center;font-size:22px;background:#f3f4f6}
.ft-order-id{font-size:11px;color:#6b7280;margin-bottom:2px}
.ft-client-name{font-size:17px;font-weight:600;color:#111827;margin-bottom:4px}
.ft-order-meta{font-size:12px;color:#6b7280}
.ft-steps{position:relative;padding:8px 0}
.ft-step{display:flex;align-items:flex-start;gap:14px;margin-bottom:0;position:relative}
.ft-step:not(:last-child) .ft-step-line{position:absolute;left:15px;top:32px;width:2px;height:calc(100% + 4px);background:#e5e7eb;z-index:0}
.ft-step:not(:last-child) .ft-step-line.done{background:#3A8C2F}
.ft-step:not(:last-child) .ft-step-line.active{background:linear-gradient(to bottom,#3A8C2F 0%,#e5e7eb 100%)}
.ft-step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;margin-bottom:20px}
.ft-step-dot.done{background:#3A8C2F}
.ft-step-dot.active{background:#2B7FC0;box-shadow:0 0 0 4px rgba(43,127,192,0.2)}
.ft-step-dot.pending{background:#f3f4f6;border:2px solid #e5e7eb}
.ft-step-dot.cancelado{background:#dc2626}
.ft-step-dot i{font-size:15px;color:white}
.ft-step-dot.pending i{color:#d1d5db}
.ft-step-info{padding-top:4px;flex:1}
.ft-step-title{font-size:14px;font-weight:500;color:#111827;margin-bottom:2px}
.ft-step-title.pending{color:#9ca3af}
.ft-step-sub{font-size:12px;color:#6b7280}
.ft-step-badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;margin-top:4px}
.ft-step-badge.fab{background:#fef3c7;color:#92400e}
.ft-step-badge.prep{background:#dbeafe;color:#1e40af}
.ft-pulse{animation:ftpulse 2s infinite}
@keyframes ftpulse{0%,100%{box-shadow:0 0 0 4px rgba(43,127,192,0.2)}50%{box-shadow:0 0 0 8px rgba(43,127,192,0.08)}}
.ft-tabs{display:flex;gap:8px;margin-bottom:12px}
.ft-tab{flex:1;padding:8px;border:0.5px solid #e5e7eb;border-radius:8px;background:white;font-size:12px;font-weight:500;color:#6b7280;cursor:pointer;text-align:center;transition:all .15s}
.ft-tab.active{background:#2B7FC0;border-color:#2B7FC0;color:white}
.ft-tracking-box{background:#f0f9ff;border:0.5px solid #bae6fd;border-radius:8px;padding:12px 14px;font-size:12px;color:#0c4a6e}
.ft-tracking-row{display:flex;justify-content:space-between;margin-bottom:6px;gap:10px}
.ft-tracking-label{color:#6b7280;flex-shrink:0}
.ft-tracking-row span:last-child{text-align:right}
.ft-tracking-status-box{background:#f9fafb;border:0.5px solid #e5e7eb;border-radius:8px;padding:12px 14px;font-size:12px;color:#374151;margin-top:10px;line-height:1.5}
.ft-copy-btn{background:none;border:0.5px solid #e5e7eb;border-radius:6px;padding:2px 8px;font-size:11px;color:#374151;cursor:pointer}
.ft-factura-card{background:#f0fdf4;border:0.5px solid #bbf7d0;border-radius:12px;padding:16px 20px;margin-bottom:12px}
.ft-factura-title{font-size:14px;font-weight:600;color:#14532d;margin-bottom:6px}
.ft-factura-sub{font-size:12px;color:#166534;margin-bottom:12px}
.ft-btn-primary{width:100%;padding:11px;background:#3A8C2F;border:none;border-radius:8px;color:white;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;font-family:inherit}
.ft-btn-secondary{width:100%;padding:11px;background:white;border:0.5px solid #d1fae5;border-radius:8px;color:#166534;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.ft-area-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ft-area-pill{flex:1;min-width:120px;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:500;text-align:center}
.ft-area-done{background:#dcfce7;color:#166534}
.ft-area-pending{background:#fef9c3;color:#854d0e}
.ft-empty,.ft-loading,.ft-error{text-align:center;padding:60px 20px;color:#6b7280;font-size:13px}
.ft-error{color:#991b1b}
/* ── v10: datos del cliente (dirección + cómo nos conociste) ── */
.dc-hola{font-size:16px;font-weight:600;color:#111827;margin:0 0 4px}
.dc-intro{font-size:13px;color:#6b7280;margin:0 0 4px;line-height:1.5}
.dc-sec{font-size:14px;font-weight:600;color:#111827;margin:0 0 10px}
.dc-opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;background:white;transition:border-color .15s,background .15s}
.dc-opt.sel{border-color:#2B7FC0;background:#f0f7fd}
.dc-opt input{margin-top:3px;accent-color:#2B7FC0}
.dc-opt-t{font-size:13px;font-weight:600;color:#111827}
.dc-opt-s{font-size:12px;color:#6b7280;margin-top:2px;line-height:1.4}
.dc-form{display:none;margin:4px 0 8px;padding:12px;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc}
.dc-form.open{display:block}
.dc-row{display:flex;gap:8px}
.dc-row>div{flex:1;min-width:0}
.dc-lbl{display:block;font-size:11px;font-weight:600;color:#374151;margin:8px 0 3px}
.dc-in,.dc-sel{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;background:white;color:#111827}
.dc-in.err,.dc-sel.err{border-color:#dc2626;background:#fef2f2}
.dc-chips{display:flex;flex-wrap:wrap;gap:8px}
.dc-chip{padding:8px 12px;border:1px solid #d1d5db;border-radius:20px;font-size:13px;background:white;color:#374151;cursor:pointer;font-family:inherit}
.dc-chip.sel{background:#2B7FC0;border-color:#2B7FC0;color:white}
.dc-msg{font-size:12px;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:9px 12px;margin-bottom:10px;display:none}
.dc-entrega{display:flex;gap:10px;align-items:flex-start}
.dc-entrega i{font-size:20px;color:#2B7FC0;margin-top:1px}
.dc-ok{display:inline-block;font-size:11px;font-weight:600;color:#166534;background:#dcfce7;border-radius:20px;padding:2px 8px;margin-top:6px}
.dc-link{background:none;border:none;color:#2B7FC0;font-size:12px;font-weight:600;cursor:pointer;padding:0;margin-top:6px;font-family:inherit}
.dc-nota{font-size:12px;color:#6b7280;margin-top:6px;line-height:1.4}
</style>
</head>
<body>
<div class="ft-page">
  <div class="ft-wrap">
    <div class="ft-header">
      <div class="ft-logo-circle">FT</div>
      <div class="ft-header-text">
        <h2>Seguimiento de pedido · v10.1</h2>
        <p>Fungiterra — Hongos a tu servicio</p>
      </div>
    </div>

    <div id="ft-contenido">
      <div class="ft-loading">Cargando tu pedido...</div>
    </div>
  </div>
</div>

<script>
const API="https://fungiterra-api-production.up.railway.app";

function getToken(){
  const params=new URLSearchParams(window.location.search);
  if(params.get("token")) return params.get("token");
  const partes=window.location.pathname.split("/").filter(Boolean);
  return partes[partes.length-1]||"";
}

const ESTADO_ENVIO_MENSAJE={
  guia_generada:"Guía generada — esperando que la paquetería recolecte el paquete. Esto puede tardar unas horas.",
  picked_up:"Tu paquete fue recolectado por la paquetería y va en camino a su primer punto de tránsito.",
  in_transit:"Tu paquete está en tránsito hacia tu domicilio.",
  out_for_delivery:"Tu paquete salió a reparto — debería llegar hoy.",
  delivered:"Tu paquete fue entregado.",
  exception:"La paquetería reportó una incidencia con este envío. Si tienes dudas, contáctanos."
};

function tiempoDesde(fechaStr){
  if(!fechaStr) return null;
  const horas=(Date.now()-new Date(fechaStr).getTime())/3600000;
  return horas;
}

async function cargarPedido(){
  const token=getToken();
  const cont=document.getElementById("ft-contenido");
  if(!token){
    cont.innerHTML="<div class=\"ft-error\">Link inválido — falta el código de seguimiento.</div>";
    return;
  }
  try{
    const [rp,rprod,rdc]=await Promise.all([
      fetch(API+"/pedidos/"+token),
      fetch(API+"/pedidos/"+token+"/productos"),
      fetch(API+"/pedidos/"+token+"/datos-cliente").catch(()=>null)
    ]);
    if(!rp.ok){
      cont.innerHTML="<div class=\"ft-error\">No encontramos este pedido. Verifica tu link o contáctanos.</div>";
      return;
    }
    const data=await rp.json();
    const dprod=await rprod.json();
    // v10: datos del cliente — si falla, el seguimiento se muestra igual
    _dc=null;
    try{ if(rdc&&rdc.ok){ const j=await rdc.json(); if(j&&j.ok) _dc=j; } }catch(e){}
    _dcPedido=data.pedido; _dcProductos=dprod.productos||[];
    if(data.pedido.estado_actual!=="cancelado"&&dcNecesita(_dc)){ renderDatos("inicial"); return; }
    render(data.pedido,dprod.productos||[]);
  }catch(e){
    cont.innerHTML="<div class=\"ft-error\">No pudimos cargar tu pedido en este momento. Intenta de nuevo en un momento.</div>";
  }
}

function render(p,productos){
  const cont=document.getElementById("ft-contenido");
  const idCorto=p.id_repositorio||p.token.substring(0,8).toUpperCase();
  const fecha=p.creado_en?new Date(p.creado_en).toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}):"—";

  cont.innerHTML=
    "<div class=\"ft-tabs\">"+
    "<div class=\"ft-tab active\" id=\"ft-tab-estado\" onclick=\"setTab('estado')\">Estado</div>"+
    "<div class=\"ft-tab\" id=\"ft-tab-envio\" onclick=\"setTab('envio')\">Envío</div>"+
    "</div>"+
    "<div id=\"tab-estado\">"+
    "<div class=\"ft-card\">"+
    "<div class=\"ft-order-id\">Pedido #"+idCorto+"</div>"+
    "<div class=\"ft-client-name\">"+(p.cliente_nombre||"—")+"</div>"+
    "<div class=\"ft-order-meta\">"+productos.length+" producto"+(productos.length!==1?"s":"")+" · "+fecha+"</div>"+
    "</div>"+
    dcEntregaCard()+
    "<div class=\"ft-card\"><div class=\"ft-steps\" id=\"steps-container\"></div></div>"+
    "</div>"+
    "<div id=\"tab-envio\" style=\"display:none\"></div>";

  renderSteps(p,productos);
  renderEnvio(p);
}

const PASOS_BASE=[
  {key:"recibido",icon:"ti-circle-check",title:"Pedido recibido"},
  {key:"en_produccion",icon:"ti-tools",title:"En producción"},
  {key:"empaquetado",icon:"ti-package",title:"Empaquetado"},
  {key:"enviado",icon:"ti-truck",title:"En camino"},
  {key:"entregado",icon:"ti-circle-check",title:"Entregado"}
];

function renderSteps(p,productos){
  // v10: si recoge en planta, no hay pasos de envío
  const recoge=!!(_dc&&_dc.recoge_en_planta);
  const PASOS=recoge?[PASOS_BASE[0],PASOS_BASE[1],{key:"listo",icon:"ti-package",title:"Listo para recoger en planta"},{key:"entregado",icon:"ti-circle-check",title:"Recogido"}]:PASOS_BASE;
  const orden=PASOS.map(x=>x.key);
  const MAPA=recoge?{empaquetado:"listo",enviado:"listo"}:{listo:"empaquetado"};
  const estadoActual=MAPA[p.estado_actual]||p.estado_actual;

  if(p.estado_actual==="cancelado"){
    document.getElementById("steps-container").innerHTML=
      "<div class=\"ft-step\">"+
      "<div class=\"ft-step-dot cancelado\"><i class=\"ti ti-x\"></i></div>"+
      "<div class=\"ft-step-info\"><div class=\"ft-step-title\">Pedido cancelado</div>"+
      "<div class=\"ft-step-sub\">Si tienes dudas sobre este pedido, contáctanos.</div></div>"+
      "</div>";
    return;
  }

  const idxActual=orden.indexOf(estadoActual);
  const html=PASOS.map((paso,i)=>{
    let estado="pending";
    if(i<idxActual) estado="done";
    else if(i===idxActual) estado="active";

    let sub="";
    let badgeEstimado="";
    if(paso.key==="en_produccion"&&estado!=="pending"){
      const fechasEst=(productos||[])
        .filter(pr=>pr.estado==="en_produccion"&&pr.fecha_estimada_termino)
        .map(pr=>new Date(pr.fecha_estimada_termino));
      if(fechasEst.length){
        const maxFecha=new Date(Math.max.apply(null,fechasEst));
        badgeEstimado="<div class=\"ft-step-badge prep\">📅 Estimado: "+maxFecha.toLocaleDateString("es-MX",{day:"2-digit",month:"short"})+"</div>";
      }
    }
    if(paso.key==="enviado"&&estado!=="pending"&&p.guia_numero){
      sub="Guía activa"+(p.paqueteria?" · "+p.paqueteria:"");
    }
    if(paso.key==="entregado"&&estado==="done"&&p.ultima_actualizacion_envio){
      sub="Entregado el "+new Date(p.ultima_actualizacion_envio).toLocaleDateString("es-MX",{day:"2-digit",month:"short"});
    }
    let evidenciaHtml="";
    if(paso.key==="empaquetado"&&p.fotos_empaquetado&&p.fotos_empaquetado.length){
      sub=(sub?sub+" · ":"")+"📷 "+p.fotos_empaquetado.length+" foto"+(p.fotos_empaquetado.length!==1?"s":"");
      evidenciaHtml="<div class=\"ft-evidencia-grid\">"+p.fotos_empaquetado.map(f=>{
        const esImg=f.tipo&&f.tipo.indexOf("image/")===0;
        const preview=esImg
          ? "<img class=\"ft-evidencia-thumb\" src=\""+f.url+"\" alt=\"Evidencia\">"
          : "<div class=\"ft-evidencia-thumb ft-evidencia-archivo\">📄</div>";
        return "<a href=\""+f.url+"\" target=\"_blank\" rel=\"noopener\">"+preview+"</a>";
      }).join("")+"</div>";
    }

    const lineClass=estado==="done"?"done":estado==="active"?"active":"";
    const pulseClass=estado==="active"?" ft-pulse":"";
    let s="<div class=\"ft-step\">";
    if(i<PASOS.length-1) s+="<div class=\"ft-step-line "+lineClass+"\"></div>";
    s+="<div class=\"ft-step-dot "+estado+pulseClass+"\"><i class=\"ti "+paso.icon+"\"></i></div>";
    s+="<div class=\"ft-step-info\"><div class=\"ft-step-title"+(estado==="pending"?" pending":"")+"\">"+paso.title+"</div>";
    if(sub) s+="<div class=\"ft-step-sub\">"+sub+"</div>";
    if(badgeEstimado) s+=badgeEstimado;
    s+=evidenciaHtml;
    s+="</div></div>";
    return s;
  }).join("");

  document.getElementById("steps-container").innerHTML=html;
}

function renderEnvio(p){
  const cont=document.getElementById("tab-envio");
  if(_dc&&_dc.recoge_en_planta){
    cont.innerHTML="<div class=\"ft-card\"><p style=\"font-size:13px;color:#6b7280;margin:0\">Elegiste recoger tu pedido en planta, así que no hay envío. Te avisaremos cuando esté listo para recoger.</p></div>";
    return;
  }
  if(!p.guia_numero){
    cont.innerHTML="<div class=\"ft-card\"><p style=\"font-size:13px;color:#6b7280;margin:0\">Aún no hay información de envío para este pedido. En cuanto se genere la guía, la verás aquí.</p></div>";
    return;
  }

  let mensajeEstado=ESTADO_ENVIO_MENSAJE[p.estado_envio]||"Estamos esperando la primera actualización de la paquetería.";
  const fechaEstimada=p.fecha_estimada_entrega?new Date(p.fecha_estimada_entrega).toLocaleDateString("es-MX",{weekday:"long",day:"2-digit",month:"long"}):null;
  const horasSinActualizar=tiempoDesde(p.ultima_actualizacion_envio);
  let avisoTardanza="";
  if(p.estado_envio&&p.estado_envio!=="delivered"&&horasSinActualizar!==null&&horasSinActualizar>48){
    avisoTardanza="<div class=\"ft-tracking-status-box\" style=\"border-color:#fde68a;background:#fffbeb;color:#92400e\">"+
      "<i class=\"ti ti-clock\" style=\"font-size:13px;vertical-align:-2px;margin-right:4px\"></i>"+
      "Sin actualizaciones recientes — esto puede pasar ocasionalmente con las paqueterías. Si tarda más de lo esperado, contáctanos."+
      "</div>";
  } else if(!p.estado_envio){
    avisoTardanza="<div class=\"ft-tracking-status-box\">"+
      "<i class=\"ti ti-clock\" style=\"font-size:13px;vertical-align:-2px;margin-right:4px\"></i>"+
      "Guía generada — esperando que la paquetería recolecte el paquete. Es normal que tarde unas horas en aparecer movimiento."+
      "</div>";
  }

  const ultimaAct=p.ultima_actualizacion_envio?new Date(p.ultima_actualizacion_envio).toLocaleString("es-MX",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—";

  cont.innerHTML=
    "<div class=\"ft-card\">"+
    "<p style=\"font-size:13px;font-weight:500;color:#111827;margin:0 0 10px\">Información de envío</p>"+
    "<div class=\"ft-tracking-box\">"+
    "<div class=\"ft-tracking-row\"><span class=\"ft-tracking-label\">Paquetería</span><span style=\"font-weight:500\">"+(p.paqueteria||"—")+"</span></div>"+
    "<div class=\"ft-tracking-row\"><span class=\"ft-tracking-label\">Guía</span><span style=\"font-weight:500;font-family:monospace\">"+p.guia_numero+"</span></div>"+
    (p.ultima_ubicacion_envio?"<div class=\"ft-tracking-row\"><span class=\"ft-tracking-label\">Última ubicación</span><span>"+p.ultima_ubicacion_envio+"</span></div>":"")+
    (fechaEstimada?"<div class=\"ft-tracking-row\"><span class=\"ft-tracking-label\">Entrega estimada</span><span style=\"font-weight:500;color:#2563eb;text-transform:capitalize\">"+fechaEstimada+"</span></div>":"")+
    "<div class=\"ft-tracking-row\" style=\"margin-bottom:0\"><span class=\"ft-tracking-label\">Última actualización</span><span>"+ultimaAct+"</span></div>"+
    "</div>"+
    (p.estado_envio?"<div class=\"ft-tracking-status-box\">"+mensajeEstado+"</div>":"")+
    avisoTardanza+
    "</div>";
}

function setTab(tab){
  document.getElementById("ft-tab-estado").classList.toggle("active",tab==="estado");
  document.getElementById("ft-tab-envio").classList.toggle("active",tab==="envio");
  document.getElementById("tab-estado").style.display=tab==="estado"?"block":"none";
  document.getElementById("tab-envio").style.display=tab==="envio"?"block":"none";
}

// ── v10: DATOS DEL CLIENTE ─────────────────────────────────────────────
// GET/POST /pedidos/:token/datos-cliente (backend v70). Antes de ver su
// seguimiento, el cliente elige a dónde se envía (dirección guardada, nueva o
// recoger en planta) y responde "¿Cómo nos conociste?" si su ficha no lo tiene.
// La dirección se puede cambiar hasta que el pedido tenga guía (bloqueada).
const ORIGEN_LABEL={facebook:"Facebook",instagram:"Instagram",tiktok:"TikTok",google:"Google",mercado_libre:"Mercado Libre",recomendacion:"Me lo recomendaron",feria_curso:"En una feria o curso",ya_era_cliente:"Ya era cliente",otro:"Otro"};
const ORIGEN_DETALLE={recomendacion:"¿Quién te recomendó? (opcional)",feria_curso:"¿Cuál feria o curso? (opcional)",otro:"Escríbelo con tus palabras"};
let _dc=null, _dcPedido=null, _dcProductos=null, _dcModo="inicial", _dcDir=null, _dcOrigen=null;
function dcEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function dcResumen(d){const num=[d.numero_ext,d.numero_int?"int. "+d.numero_int:""].filter(Boolean).join(" ");return [[d.calle,num].filter(Boolean).join(" "),d.colonia?"Col. "+d.colonia:"",d.cp?"CP "+d.cp:""].filter(Boolean).join(", ");}
function dcNecesita(dc){return !!dc&&((dc.pide_direccion&&!dc.bloqueada)||dc.pide_origen);}
function renderDatos(modo){
  _dcModo=modo; _dcDir=null; _dcOrigen=null;
  const dc=_dc, cont=document.getElementById("ft-contenido");
  const pideDir=modo==="cambiar"||(dc.pide_direccion&&!dc.bloqueada);
  const pideOri=modo!=="cambiar"&&dc.pide_origen;
  let h="<div class=\"ft-card\">";
  if(modo==="cambiar") h+="<p class=\"dc-hola\">Cambiar a dónde enviamos tu pedido</p><p class=\"dc-intro\">Puedes cambiarla hasta que tu pedido tenga guía de envío.</p>";
  else h+="<p class=\"dc-hola\">¡Hola"+(dc.nombre?" "+dcEsc(dc.nombre):"")+"! 👋</p><p class=\"dc-intro\">Antes de ver tu pedido, ayúdanos con "+(pideDir&&pideOri?"dos datos":"un dato")+". Solo toma un momento.</p>";
  h+="</div><div class=\"dc-msg\" id=\"dc-msg\"></div>";
  if(pideDir){
    h+="<div class=\"ft-card\"><p class=\"dc-sec\">📍 ¿A dónde te lo enviamos?</p>";
    (dc.direcciones||[]).forEach(d=>{
      h+="<label class=\"dc-opt\" data-dir=\"id:"+d.id+"\" onclick=\"dcElegirDir('id:"+d.id+"')\"><input type=\"radio\" name=\"dc-dir\"><div><div class=\"dc-opt-t\">"+dcEsc(dcResumen(d))+"</div><div class=\"dc-opt-s\">Dirección guardada</div></div></label>";
    });
    h+="<label class=\"dc-opt\" data-dir=\"nueva\" onclick=\"dcElegirDir('nueva')\"><input type=\"radio\" name=\"dc-dir\"><div><div class=\"dc-opt-t\">+ "+((dc.direcciones||[]).length?"Otra dirección":"Agregar mi dirección")+"</div><div class=\"dc-opt-s\">Se guarda para tus próximos pedidos</div></div></label>";
    h+="<div class=\"dc-form\" id=\"dc-form\">"
      +"<label class=\"dc-lbl\">Nombre de quien recibe</label><input class=\"dc-in\" id=\"dc-nombre_recibe\" autocomplete=\"name\">"
      +"<label class=\"dc-lbl\">Teléfono (10 dígitos)</label><input class=\"dc-in\" id=\"dc-telefono\" inputmode=\"tel\" autocomplete=\"tel\">"
      +"<label class=\"dc-lbl\">Calle</label><input class=\"dc-in\" id=\"dc-calle\" autocomplete=\"address-line1\">"
      +"<div class=\"dc-row\"><div><label class=\"dc-lbl\">Núm. exterior</label><input class=\"dc-in\" id=\"dc-numero_ext\"></div><div><label class=\"dc-lbl\">Núm. interior</label><input class=\"dc-in\" id=\"dc-numero_int\" placeholder=\"Opcional\"></div></div>"
      +"<label class=\"dc-lbl\">Colonia</label><input class=\"dc-in\" id=\"dc-colonia\">"
      +"<div class=\"dc-row\"><div><label class=\"dc-lbl\">Código postal</label><input class=\"dc-in\" id=\"dc-cp\" inputmode=\"numeric\" maxlength=\"5\" autocomplete=\"postal-code\"></div><div><label class=\"dc-lbl\">Ciudad o municipio</label><input class=\"dc-in\" id=\"dc-ciudad\"></div></div>"
      +"<label class=\"dc-lbl\">Estado</label><select class=\"dc-sel\" id=\"dc-estado\"><option value=\"\">Elige tu estado</option>"+(dc.estados||[]).map(e=>"<option>"+dcEsc(e)+"</option>").join("")+"</select>"
      +"<label class=\"dc-lbl\">Referencias</label><input class=\"dc-in\" id=\"dc-referencias\" placeholder=\"Entre calles, color de la casa… (opcional)\">"
      +"</div>";
    h+="<label class=\"dc-opt\" data-dir=\"planta\" onclick=\"dcElegirDir('planta')\"><input type=\"radio\" name=\"dc-dir\"><div><div class=\"dc-opt-t\">🏭 Paso a recogerlo a la planta</div><div class=\"dc-opt-s\">Te avisamos cuando esté listo para recoger</div></div></label>";
    h+="</div>";
  }
  if(pideOri){
    h+="<div class=\"ft-card\"><p class=\"dc-sec\">💬 ¿Cómo nos conociste?</p><div class=\"dc-chips\">"
      +(dc.origenes||Object.keys(ORIGEN_LABEL)).map(o=>"<button type=\"button\" class=\"dc-chip\" data-o=\""+o+"\" onclick=\"dcElegirOrigen('"+o+"')\">"+dcEsc(ORIGEN_LABEL[o]||o)+"</button>").join("")
      +"</div><div id=\"dc-detalle-box\" style=\"display:none\"><label class=\"dc-lbl\" id=\"dc-detalle-lbl\"></label><input class=\"dc-in\" id=\"dc-detalle\" maxlength=\"150\"></div>"
      +"<label class=\"dc-lbl\" style=\"margin-top:12px\">¿Ninguna te queda? Escríbelo:</label><input class=\"dc-in\" id=\"dc-libre\" maxlength=\"150\" placeholder=\"Por ejemplo: vi un anuncio en…\" oninput=\"dcLibre(this.value)\"></div>";
  }
  h+="<button class=\"ft-btn-primary\" id=\"dc-btn\" onclick=\"dcEnviar()\" style=\"background:#2B7FC0\">"+(modo==="cambiar"?"Guardar dirección":"Continuar a mi pedido")+"</button>";
  if(modo==="cambiar") h+="<button class=\"ft-btn-secondary\" style=\"border-color:#e5e7eb;color:#374151\" onclick=\"dcMostrarPedido()\">Cancelar</button>";
  cont.innerHTML=h;
  if(pideDir&&!(dc.direcciones||[]).length) dcElegirDir("nueva");
}
function dcElegirDir(v){
  _dcDir=v;
  document.querySelectorAll(".dc-opt[data-dir]").forEach(el=>{const s=el.dataset.dir===v;el.classList.toggle("sel",s);el.querySelector("input").checked=s;});
  const f=document.getElementById("dc-form"); if(f) f.classList.toggle("open",v==="nueva");
}
function dcElegirOrigen(o){
  _dcOrigen=o;
  document.querySelectorAll(".dc-chip").forEach(b=>b.classList.toggle("sel",b.dataset.o===o));
  const box=document.getElementById("dc-detalle-box"), lbl=ORIGEN_DETALLE[o];
  if(o!=="otro"){const l=document.getElementById("dc-libre"); if(l) l.value="";}
  if(lbl&&o!=="otro"){box.style.display="block";document.getElementById("dc-detalle-lbl").textContent=lbl;}
  else box.style.display="none";
  if(o==="otro") document.getElementById("dc-libre").focus();
}
function dcLibre(v){
  if(v.trim()){ if(_dcOrigen!=="otro"){ _dcOrigen="otro"; document.querySelectorAll(".dc-chip").forEach(b=>b.classList.toggle("sel",b.dataset.o==="otro")); document.getElementById("dc-detalle-box").style.display="none"; } }
}
function dcError(msg){const m=document.getElementById("dc-msg");m.textContent=msg;m.style.display="block";m.scrollIntoView({behavior:"smooth",block:"center"});}
async function dcEnviar(){
  const dc=_dc, body={};
  document.querySelectorAll(".dc-in.err,.dc-sel.err").forEach(e=>e.classList.remove("err"));
  document.getElementById("dc-msg").style.display="none";
  const pideDir=_dcModo==="cambiar"||(dc.pide_direccion&&!dc.bloqueada), pideOri=_dcModo!=="cambiar"&&dc.pide_origen;
  if(pideDir){
    if(!_dcDir) return dcError("Elige a dónde enviamos tu pedido.");
    if(_dcDir==="planta") body.recoge_en_planta=true;
    else if(_dcDir.indexOf("id:")===0) body.direccion_id=Number(_dcDir.slice(3));
    else {
      const n={}; ["nombre_recibe","telefono","calle","numero_ext","numero_int","colonia","cp","ciudad","estado","referencias"].forEach(k=>{n[k]=document.getElementById("dc-"+k).value.trim();});
      const falta=[]; const marca=k=>{document.getElementById("dc-"+k).classList.add("err");};
      if(!n.nombre_recibe){falta.push("nombre de quien recibe");marca("nombre_recibe");}
      if(n.telefono.replace(/\D/g,"").length<10){falta.push("teléfono a 10 dígitos");marca("telefono");}
      if(!n.calle){falta.push("calle");marca("calle");}
      if(!n.numero_ext){falta.push("número exterior");marca("numero_ext");}
      if(!n.colonia){falta.push("colonia");marca("colonia");}
      if(!/^\d{5}$/.test(n.cp)){falta.push("código postal de 5 dígitos");marca("cp");}
      if(!n.ciudad){falta.push("ciudad");marca("ciudad");}
      if(!n.estado){falta.push("estado");marca("estado");}
      if(falta.length) return dcError("Revisa: "+falta.join(", ")+".");
      body.nueva=n;
    }
  }
  if(pideOri){
    if(!_dcOrigen) return dcError("Cuéntanos cómo nos conociste.");
    body.como_nos_conocio=_dcOrigen;
    const libre=(document.getElementById("dc-libre").value||"").trim(), det=(document.getElementById("dc-detalle").value||"").trim();
    if(_dcOrigen==="otro"&&!libre) return dcError("Escribe cómo nos conociste.");
    body.detalle=_dcOrigen==="otro"?libre:det;
  }
  const btn=document.getElementById("dc-btn"); btn.disabled=true; btn.textContent="Guardando…";
  try{
    const r=await fetch(API+"/pedidos/"+getToken()+"/datos-cliente",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok){
      btn.disabled=false; btn.textContent=_dcModo==="cambiar"?"Guardar dirección":"Continuar a mi pedido";
      if(Array.isArray(d.campos)) d.campos.forEach(c=>{const map={"Nombre de quien recibe":"nombre_recibe","Teléfono a 10 dígitos":"telefono","Calle":"calle","Número exterior":"numero_ext","Colonia":"colonia","Ciudad o municipio":"ciudad","Estado":"estado","Código postal (5 dígitos)":"cp"};const el=map[c]&&document.getElementById("dc-"+map[c]);if(el)el.classList.add("err");});
      return dcError(d.error||"No pudimos guardar tus datos. Intenta de nuevo.");
    }
    await cargarPedido();
  }catch(e){ btn.disabled=false; btn.textContent="Intentar de nuevo"; dcError("Sin conexión. Revisa tu internet e intenta de nuevo."); }
}
function dcMostrarPedido(){ render(_dcPedido,_dcProductos); }
function dcEntregaCard(){
  const dc=_dc; if(!dc) return "";
  if(!dc.recoge_en_planta&&!dc.direccion_confirmada) return "";
  let h="<div class=\"ft-card\"><div class=\"dc-entrega\"><span style=\"font-size:20px;line-height:1\">"+(dc.recoge_en_planta?"🏭":"📍")+"</span><div style=\"flex:1\">";
  h+="<div class=\"ft-order-id\">"+(dc.recoge_en_planta?"Entrega":"Se envía a")+"</div>";
  h+="<div style=\"font-size:13px;font-weight:500;color:#111827;line-height:1.4\">"+(dc.recoge_en_planta?"Recoges en planta":dcEsc(dc.direccion_confirmada))+"</div>";
  h+="<span class=\"dc-ok\">✓ Confirmada</span>";
  if(!dc.bloqueada) h+="<br><button class=\"dc-link\" onclick=\"renderDatos('cambiar')\">Cambiar</button>";
  else if(!dc.recoge_en_planta) h+="<div class=\"dc-nota\">Tu pedido ya tiene guía de envío. Si necesitas cambiar algo, contáctanos.</div>";
  return h+"</div></div></div>";
}

cargarPedido();
</script>
